<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-label="Pulse niveau 8 animé">
<style>
#character{transform-origin:210px 250px;animation:breath 3.5s ease-in-out infinite}
.lid{animation:blink 5.8s steps(1,end) infinite}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.014,.986)}}
@keyframes blink{0%,39%,42%,100%{opacity:0}40%,41%{opacity:1}}
@media(prefers-reduced-motion:reduce){#character,.lid{animation:none!important}}
</style>
<g id="character"><image href="data:image/webp;base64," width="420" height="420"/><g class="lid" opacity="0"><ellipse cx="145" cy="149" rx="16" ry="20" fill="#45cfc3"/><path d="M132 150 Q145 158 158 150" fill="none" stroke="#153b59" stroke-width="3" stroke-linecap="round"/></g><g class="lid" opacity="0"><ellipse cx="215" cy="140" rx="17" ry="20" fill="#3cc6bf"/><path d="M201 141 Q215 149 229 141" fill="none" stroke="#153b59" stroke-width="3" stroke-linecap="round"/></g></g>
</svg>