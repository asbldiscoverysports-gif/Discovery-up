<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-label="Pulse niveau 2 animé">
<style>
#character{transform-origin:210px 250px;animation:breath 3.5s ease-in-out infinite}
.lid{animation:blink 5.8s steps(1,end) infinite}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.014,.986)}}
@keyframes blink{0%,39%,42%,100%{opacity:0}40%,41%{opacity:1}}
@media(prefers-reduced-motion:reduce){#character,.lid{animation:none!important}}
</style>
<g id="character"><image href="data:image/webp;base64," width="420" height="420"/><g class="lid" opacity="0"><ellipse cx="150" cy="209" rx="15" ry="19" fill="#43cfc5"/><path d="M138 210 Q150 218 162 210" fill="none" stroke="#153b59" stroke-width="3" stroke-linecap="round"/></g><g class="lid" opacity="0"><ellipse cx="216" cy="218" rx="17" ry="19" fill="#3bc8c2"/><path d="M202 219 Q216 227 230 219" fill="none" stroke="#153b59" stroke-width="3" stroke-linecap="round"/></g></g>
</svg>