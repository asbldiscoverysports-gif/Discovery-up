<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-label="Pulse niveau 6 animé">
<style>
#character{transform-origin:210px 250px;animation:breath 3.5s ease-in-out infinite}
.lid{animation:blink 5.8s steps(1,end) infinite}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.014,.986)}}
@keyframes blink{0%,39%,42%,100%{opacity:0}40%,41%{opacity:1}}
@media(prefers-reduced-motion:reduce){#character,.lid{animation:none!important}}
</style>
<g id="character"><image href="data:image/webp;base64," width="420" height="420"/><g class="lid" opacity="0"><ellipse cx="159" cy="145" rx="16" ry="20" fill="#46cfc5"/><path d="M146 146 Q159 154 172 146" fill="none" stroke="#153b59" stroke-width="3" stroke-linecap="round"/></g><g class="lid" opacity="0"><ellipse cx="229" cy="154" rx="17" ry="20" fill="#38c7c0"/><path d="M215 155 Q229 163 243 155" fill="none" stroke="#153b59" stroke-width="3" stroke-linecap="round"/></g></g>
</svg>